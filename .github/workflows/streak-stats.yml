
name: Update GitHub Profile Statistics

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak statistics
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Atharva1118&theme=dark&disable_animations=true
          path: profile/streak.svg

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Atharva1118&show_icons=true&theme=github_dark&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=58A6FF&hide_border=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Atharva1118&layout=compact&langs_count=6&theme=github_dark&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No statistics changes"
            exit 0
          fi

          git commit -m "Update GitHub profile statistics"
          git push
